name: ClawReflex
on:
  push:
    paths: ['clawreflex/**', 'pyproject.toml', '.github/workflows/clawreflex.yml']
  pull_request:
    paths: ['clawreflex/**', 'pyproject.toml', '.github/workflows/clawreflex.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      CLAWREFLEX_SANDBOX_IMAGE: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /usr/bin/true
      - name: macOS sandbox VM
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 4 --disk 20 --mount /private/tmp:w
          docker pull "$CLAWREFLEX_SANDBOX_IMAGE"
          echo 'DOCKER_HOST=unix://'"$HOME"'/.colima/default/docker.sock' >> "$GITHUB_ENV"
          echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[dev]'
      - run: clawreflex --version
      - run: ruff check clawreflex
      - run: mypy
      - run: coverage run -m pytest
      - run: coverage report --fail-under=85
      - run: node --test clawreflex/openclaw/test_plugin.mjs
      - run: python -m clawreflex.doctor --output install-selfcheck.json
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .coverage
            install-selfcheck.json
            dist/*
          include-hidden-files: true
      - name: Stop sandbox VM
        if: always() && runner.os == 'macOS'
        run: colima stop
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pip install -e '.[dev]'
      - run: npm install --no-save --ignore-scripts puppeteer
      - run: npx puppeteer browsers install chrome
      - run: node --test clawreflex/openclaw/test_monitor.mjs
        env:
          CLAWREFLEX_TEST_PYTHON: python
